spring.application.name=boleiroOn
server.port=${SERVER_PORT}
app.front.url=${FRONTEND_URL}

spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

security.token.secret.user=${SECURITY_TOKEN_SECRET}
security.token.expiration-hours=${TOKEN_EXPIRATION_HOURS}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.admin.default-email=${ADMIN_EMAIL}
app.admin.default-login=${ADMIN_LOGIN}
app.admin.default-password=${ADMIN_PASSWORD}

aws.accessKeyId=${AWS_ACCESS_KEY}
aws.secretKey=${AWS_SECRET_KEY}
aws.region=${AWS_REGION}
aws.s3.bucketName=${AWS_BUCKET_NAME}

resend.api.key=${RESEND_API_KEY}

app.email.verification=${EMAIL_VERIFICATION}
app.email.boleto=${EMAIL_BOLETO_ONLINE}
app.email.intern=${EMAIL_SYSTEM}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===========================================
# CACHE CONFIGURATION
# ===========================================
# Tipo de cache: caffeine (local/in-memory) ou redis (distribuído)
cache.type=caffeine

# Configurações Caffeine (usado quando cache.type=caffeine)
# TTL padrão: 30 minutos, idle timeout: 10 minutos, max 1000 entries
cache.caffeine.spec=maximumSize=1000,expireAfterWrite=30m,expireAfterAccess=10m,recordStats

# Configurações Redis (usado quando cache.type=redis)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# Actuator endpoints para monitoramento de cache
management.endpoints.web.exposure.include=health,info,cache-admin
management.endpoint.cache-admin.enabled=true
management.endpoint.health.show-details=always